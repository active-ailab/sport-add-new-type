[project]
name = "sport-config-tools"
version = "0.2.0"
description = "Safely generate sport protobuf and sports.xlsx configuration outputs."
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [
  { name = "Zepp Health Active BU AI Lab" }
]
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "Flask>=3.0,<3.1",
]

[project.scripts]
sport-proto = "sport_proto.sport_proto:main"
sport-config = "sport_config.sport_config:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sport_config", "src/sport_proto"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
